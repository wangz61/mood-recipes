<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Mood Recipes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Georgia", "Cambria", "serif"],
              sans: ["system-ui", "Segoe UI", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      dialog::backdrop { background: rgb(15 23 42 / 0.45); backdrop-filter: blur(2px); }
      .chip-check:checked + span { background: #ffedd5; border-color: #fb923c; color: #9a3412; }
      .chip-check:focus-visible + span { outline: 2px solid #fb923c; outline-offset: 2px; }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-rose-100 text-slate-800">
    <div class="mx-auto max-w-2xl px-4 py-6">
      <nav id="nav" class="mb-8 flex min-h-9 flex-wrap items-center gap-1" aria-label="Main"></nav>

      <header class="mb-10 text-center">
        <h1 class="font-display text-3xl font-semibold tracking-tight text-slate-900 md:text-4xl">Mood-based recipes</h1>
        <p class="mt-2 text-sm text-slate-600">Pick how you feel — we’ll suggest something to cook.</p>
      </header>

      <section class="mb-8" aria-labelledby="mood-heading">
        <h2 id="mood-heading" class="mb-3 text-sm font-medium uppercase tracking-wide text-slate-500">Your mood</h2>
        <div id="mood-buttons" class="flex flex-wrap gap-2" role="group" aria-label="Select mood"></div>
        <p id="mood-hint" class="mt-3 hidden text-xs text-slate-500"></p>
      </section>

      <div id="error" class="mb-4 hidden rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" role="alert"></div>

      <section
        id="recipe-section"
        class="hidden rounded-2xl border border-white/60 bg-white/80 p-6 shadow-lg shadow-orange-900/5 backdrop-blur"
        aria-live="polite"
      >
        <div id="recipe-loading" class="flex items-center gap-3 text-slate-600">
          <span class="inline-block h-5 w-5 animate-spin rounded-full border-2 border-orange-400 border-t-transparent" aria-hidden="true"></span>
          <span>Finding a recipe…</span>
        </div>

        <div id="recipe-content" class="hidden">
          <div class="overflow-hidden rounded-xl bg-slate-100">
            <img id="recipe-image" src="" alt="" class="aspect-video w-full object-cover" loading="lazy" />
          </div>
          <div class="mt-4 flex items-start justify-between gap-4">
            <div class="min-w-0">
              <h3 id="recipe-title" class="font-display text-2xl font-semibold text-slate-900"></h3>
              <p id="recipe-meta" class="mt-1 text-sm text-slate-500"></p>
            </div>
            <button
              type="button"
              id="btn-favorite"
              aria-pressed="false"
              class="inline-flex shrink-0 items-center gap-2 rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm transition hover:border-rose-300 hover:bg-rose-50 focus:outline-none focus:ring-2 focus:ring-rose-400 disabled:opacity-60"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  id="heart"
                  d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linejoin="round"
                />
              </svg>
              <span id="btn-favorite-label">Save</span>
            </button>
          </div>
          <p id="favorite-note" class="mt-2 hidden text-xs text-slate-500"></p>
          <div id="recipe-ingredients" class="mt-4"></div>
          <p id="recipe-instructions" class="mt-4 whitespace-pre-wrap text-sm leading-relaxed text-slate-700"></p>
          <div class="mt-6 flex flex-wrap gap-3">
            <button
              type="button"
              id="btn-another"
              class="rounded-lg bg-orange-600 px-4 py-2.5 text-sm font-medium text-white shadow hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2"
            >
              Another recipe
            </button>
            <a
              id="recipe-youtube"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              class="hidden rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50"
            >
              Watch video
            </a>
          </div>
        </div>
      </section>

      <p class="mt-8 text-center text-xs text-slate-400">
        Recipes via
        <a href="https://www.themealdb.com/" class="underline hover:text-slate-600" target="_blank" rel="noopener">TheMealDB</a>
      </p>
    </div>

    <dialog id="mood-dialog" class="w-[min(36rem,calc(100vw-2rem))] rounded-2xl p-0 shadow-2xl" aria-labelledby="mood-dialog-title">
      <form id="mood-form" class="flex max-h-[85vh] flex-col" method="dialog">
        <div class="border-b border-slate-100 px-6 pb-4 pt-5">
          <h2 id="mood-dialog-title" class="font-display text-xl font-semibold text-slate-900">New mood</h2>
          <p class="mt-1 text-sm text-slate-500">Choose the kinds of dishes this mood should suggest.</p>
        </div>
        <div class="flex-1 space-y-5 overflow-y-auto px-6 py-5">
          <div class="grid grid-cols-[1fr_5.5rem] gap-3">
            <label class="block">
              <span class="mb-1 block text-sm font-medium text-slate-700">Name</span>
              <input
                id="mood-label"
                required
                maxlength="24"
                placeholder="Rainy day"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-orange-400 focus:outline-none focus:ring-2 focus:ring-orange-200"
              />
            </label>
            <label class="block">
              <span class="mb-1 block text-sm font-medium text-slate-700">Emoji</span>
              <input
                id="mood-emoji"
                maxlength="8"
                placeholder="🌧️"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-center text-sm focus:border-orange-400 focus:outline-none focus:ring-2 focus:ring-orange-200"
              />
            </label>
          </div>
          <fieldset>
            <legend class="mb-2 text-sm font-medium text-slate-700">Categories</legend>
            <div id="mood-categories" class="flex flex-wrap gap-2"></div>
          </fieldset>
          <fieldset>
            <legend class="mb-2 text-sm font-medium text-slate-700">Cuisines</legend>
            <input
              id="area-filter"
              type="search"
              placeholder="Filter cuisines…"
              class="mb-2 w-full rounded-lg border border-slate-200 px-3 py-1.5 text-sm focus:border-orange-400 focus:outline-none focus:ring-2 focus:ring-orange-200"
            />
            <div id="mood-areas" class="flex max-h-40 flex-wrap gap-2 overflow-y-auto pr-1"></div>
          </fieldset>
          <p id="mood-error" class="hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-800" role="alert"></p>
        </div>
        <div class="flex items-center justify-between gap-3 border-t border-slate-100 px-6 py-4">
          <span id="mood-count" class="text-xs text-slate-500">Nothing selected</span>
          <div class="flex gap-2">
            <button type="button" id="mood-cancel" class="rounded-lg px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100">Cancel</button>
            <button
              type="submit"
              id="mood-save"
              class="rounded-lg bg-orange-600 px-4 py-2 text-sm font-medium text-white shadow hover:bg-orange-700 disabled:opacity-60"
            >
              Create mood
            </button>
          </div>
        </div>
      </form>
    </dialog>

    <script src="/common.js"></script>
    <script src="/script.js"></script>
  </body>
</html>

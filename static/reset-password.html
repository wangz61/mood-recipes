<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Reset password · Mood Recipes</title>
    <!-- The reset token is in the URL; never pass it on to other sites. -->
    <meta name="referrer" content="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ["Montserrat", "system-ui", "sans-serif"] } } } };
    </script>
    <style>
      .login-bg {
        min-height: 100vh;
        background: linear-gradient(180deg, #d946ef 0%, #a21caf 22%, #7c3aed 55%, #a78bfa 82%, #c4d4ff 100%);
      }
      .login-btn { display: block; width: 100%; margin-top: 2rem; box-sizing: border-box; }
      .field-input {
        width: 100%;
        border: 0;
        border-bottom: 1px solid #fff;
        background: transparent;
        padding: 0 0 0.5rem;
        font-size: 15px;
        color: #fff;
        outline: none;
      }
      .field-input:focus { border-bottom-width: 2px; margin-bottom: -1px; }
    </style>
  </head>
  <body class="login-bg flex flex-col items-center justify-center px-5 py-8 font-sans antialiased">
    <div class="w-full max-w-[400px] rounded-[28px] border border-white/35 bg-white/[0.06] px-8 pb-9 pt-8 shadow-[0_25px_50px_-12px_rgba(0,0,0,0.25)] backdrop-blur-[2px]">
      <h1 class="mb-7 text-center text-[26px] font-bold tracking-tight text-white">New Password</h1>

      <p id="message" class="mb-5 hidden rounded-xl px-4 py-3 text-[14px] font-medium" role="status"></p>

      <form id="reset-form" novalidate>
        <div class="mb-6">
          <label for="password" class="mb-2 block text-[15px] font-medium text-white">New password</label>
          <input id="password" type="password" required minlength="8" autocomplete="new-password" class="field-input" />
          <p class="mt-2 text-[12px] text-white/75">At least 8 characters.</p>
        </div>
        <div class="mb-2">
          <label for="confirm" class="mb-2 block text-[15px] font-medium text-white">Confirm password</label>
          <input id="confirm" type="password" required autocomplete="new-password" class="field-input" />
        </div>
        <button
          id="submit"
          type="submit"
          class="login-btn w-full rounded-full bg-white py-3 text-[15px] font-bold tracking-wide text-[#1a0a2e] shadow-sm transition hover:bg-white/95 focus:outline-none focus:ring-2 focus:ring-white/60 disabled:opacity-70"
        >
          Save password
        </button>
      </form>

      <p class="mt-7 text-center text-[14px] text-white">
        Link expired?
        <a href="/login.html#forgot" class="font-bold text-white underline-offset-2 hover:underline">Send a new one</a>
      </p>
    </div>
    <a href="/" class="mt-6 text-[14px] font-medium text-white/90 underline-offset-2 hover:underline">← Back to recipes</a>

    <script src="/common.js"></script>
    <script src="/reset-password.js"></script>
  </body>
</html>

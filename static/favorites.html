<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Favorites · Mood Recipes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Georgia", "Cambria", "serif"],
              sans: ["system-ui", "Segoe UI", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      dialog::backdrop { background: rgb(15 23 42 / 0.45); backdrop-filter: blur(2px); }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-amber-50 via-orange-50 to-rose-100 text-slate-800">
    <div class="mx-auto max-w-5xl px-4 py-6">
      <nav id="nav" class="mb-8 flex min-h-9 flex-wrap items-center gap-1" aria-label="Main"></nav>

      <header class="mb-6 flex flex-wrap items-end justify-between gap-3">
        <div>
          <h1 class="font-display text-3xl font-semibold tracking-tight text-slate-900 md:text-4xl">Your favorites</h1>
          <p id="summary" class="mt-2 text-sm text-slate-600">Loading…</p>
        </div>
      </header>

      <div id="filters" class="mb-6 flex flex-wrap gap-2" role="group" aria-label="Filter by mood"></div>

      <div id="error" class="mb-4 hidden rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" role="alert"></div>

      <ul id="grid" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></ul>

      <div id="empty" class="hidden rounded-2xl border border-white/60 bg-white/80 p-10 text-center shadow-lg shadow-orange-900/5">
        <p class="font-display text-xl font-semibold text-slate-900">No favorites yet</p>
        <p class="mx-auto mt-2 max-w-sm text-sm text-slate-600">
          Pick a mood on the recipes page and press <strong>Save</strong> on a dish you like. It will show up here with its mood.
        </p>
        <a
          href="/"
          class="mt-5 inline-block rounded-lg bg-orange-600 px-4 py-2.5 text-sm font-medium text-white shadow hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:ring-offset-2"
          >Find a recipe</a
        >
      </div>
    </div>

    <dialog id="detail" class="w-[min(42rem,calc(100vw-2rem))] rounded-2xl p-0 shadow-2xl" aria-labelledby="detail-title">
      <div class="flex max-h-[88vh] flex-col">
        <div class="relative">
          <img id="detail-image" alt="" class="aspect-video w-full rounded-t-2xl bg-slate-100 object-cover" />
          <button
            type="button"
            id="detail-close"
            class="absolute right-3 top-3 rounded-full bg-white/90 px-3 py-1 text-sm font-medium text-slate-700 shadow hover:bg-white focus:outline-none focus:ring-2 focus:ring-orange-400"
          >
            Close
          </button>
        </div>
        <div class="overflow-y-auto px-6 pb-6 pt-4">
          <h2 id="detail-title" class="font-display text-2xl font-semibold text-slate-900"></h2>
          <p id="detail-meta" class="mt-1 text-sm text-slate-500"></p>
          <div id="detail-moods" class="mt-3 flex flex-wrap gap-1.5"></div>
          <div id="detail-body" class="mt-4 text-sm text-slate-700"></div>
        </div>
      </div>
    </dialog>

    <script src="/common.js"></script>
    <script src="/favorites.js"></script>
  </body>
</html>
